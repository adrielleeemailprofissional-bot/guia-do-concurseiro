<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia do Concurseiro</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    text-align: center;
    padding: 20px;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h1 {
    margin-bottom: 10px;
}
#timer {
    font-size: 40px;
    margin: 20px 0;
}
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    font-size: 16px;
}
button:hover {
    opacity: 0.9;
}
input {
    padding: 8px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
ul {
    text-align: left;
}
</style>
</head>
<body>

<div class="container">
    <h1>📚 Guia do Concurseiro</h1>

    <div id="timer">00:00:00</div>

    <button onclick="startTimer()">Iniciar</button>
    <button onclick="pauseTimer()">Pausar</button>
    <button onclick="resetTimer()">Zerar</button>

    <hr>

    <h3>Registrar Sessão</h3>
    <input type="text" id="materia" placeholder="Matéria">
    <button onclick="salvarSessao()">Salvar</button>

    <ul id="lista"></ul>
</div>

<script>
let segundos = 0;
let intervalo = null;

function atualizarTimer() {
    segundos++;
    let h = String(Math.floor(segundos / 3600)).padStart(2, '0');
    let m = String(Math.floor((segundos % 3600) / 60)).padStart(2, '0');
    let s = String(segundos % 60).padStart(2, '0');
    document.getElementById("timer").innerText = h + ":" + m + ":" + s;
}

function startTimer() {
    if (!intervalo) {
        intervalo = setInterval(atualizarTimer, 1000);
    }
}

function pauseTimer() {
    clearInterval(intervalo);
    intervalo = null;
}

function resetTimer() {
    pauseTimer();
    segundos = 0;
    document.getElementById("timer").innerText = "00:00:00";
}

function salvarSessao() {
    let materia = document.getElementById("materia").value;
    if (!materia) return;

    let li = document.createElement("li");
    li.textContent = materia + " - " + document.getElementById("timer").innerText;
    document.getElementById("lista").appendChild(li);

    document.getElementById("materia").value = "";
    resetTimer();
}
</script>

</body>
</html>
