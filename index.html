<style>
  :root{
    --bg1:#0b1220;
    --bg2:#0f1b33;
    --card:rgba(255,255,255,.08);
    --card2:rgba(255,255,255,.10);
    --stroke:rgba(255,255,255,.12);
    --text:rgba(255,255,255,.92);
    --muted:rgba(255,255,255,.68);
    --blue:#4f8cff;
    --blue2:#2f6fff;
    --danger:#ff4d5a;
    --shadow: 0 18px 45px rgba(0,0,0,.35);
    --radius:18px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
    color:var(--text);
    background:
      radial-gradient(900px 500px at 10% 10%, rgba(79,140,255,.25), transparent 55%),
      radial-gradient(700px 450px at 90% 20%, rgba(111,66,193,.22), transparent 55%),
      radial-gradient(800px 500px at 50% 110%, rgba(0,255,170,.10), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    padding:18px;
  }

  .wrap{ max-width: 720px; margin: 0 auto; }

  .card{
    background: linear-gradient(180deg, var(--card2), var(--card));
    border:1px solid var(--stroke);
    border-radius: var(--radius);
    padding:18px;
    box-shadow: var(--shadow);
    margin-bottom:14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  h1{
    margin:0 0 8px;
    text-align:center;
    font-weight:800;
    letter-spacing:.2px;
  }

  .sub{
    text-align:center;
    color:var(--muted);
    margin-top:-2px;
    margin-bottom:12px;
    font-size:13px;
  }

  /* Tabs estilo “pílula” */
  .tabs{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:10px 0 0;
  }
  .tab{
    padding:10px 14px;
    border-radius:999px;
    border:1px solid var(--stroke);
    background: rgba(255,255,255,.06);
    color: var(--text);
    font-weight:700;
    font-size:14px;
  }
  .tab.active{
    background: linear-gradient(180deg, var(--blue), var(--blue2));
    border-color: transparent;
    box-shadow: 0 10px 25px rgba(79,140,255,.22);
  }

  /* Timer grande e “app-like” */
  #timer{
    font-size:52px;
    text-align:center;
    margin: 14px 0 10px;
    font-weight:900;
    letter-spacing: 2px;
    text-shadow: 0 10px 25px rgba(0,0,0,.35);
  }

  .btnrow{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:6px;
  }

  button{
    padding:12px 16px;
    border:none;
    border-radius:14px;
    background: linear-gradient(180deg, var(--blue), var(--blue2));
    color:#fff;
    font-size:16px;
    font-weight:800;
    box-shadow: 0 14px 30px rgba(79,140,255,.18);
    cursor:pointer;
  }
  button.secondary{
    background: rgba(255,255,255,.10);
    border:1px solid var(--stroke);
    box-shadow:none;
    color:var(--text);
  }
  button.danger{
    background: linear-gradient(180deg, var(--danger), #ff2f3f);
    box-shadow: 0 14px 30px rgba(255,77,90,.18);
  }

  hr{
    margin:16px 0;
    border:none;
    border-top:1px solid rgba(255,255,255,.10);
  }

  label{
    font-weight:800;
    display:block;
    margin-top:10px;
    color: rgba(255,255,255,.85);
    font-size:13px;
  }

  input, select{
    width:100%;
    padding:12px 12px;
    border-radius:14px;
    border:1px solid var(--stroke);
    background: rgba(0,0,0,.18);
    color:var(--text);
    margin-top:8px;
    outline:none;
  }
  input::placeholder{ color: rgba(255,255,255,.45); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){
    .grid2{ grid-template-columns:1fr; }
    #timer{ font-size:46px; }
  }

  .muted{ color:var(--muted); font-size:13px; }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.10);
  }
  th, td{
    border-bottom:1px solid rgba(255,255,255,.08);
    padding:10px 8px;
    text-align:left;
    font-size:14px;
  }
  th{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color: rgba(255,255,255,.65);
    background: rgba(255,255,255,.06);
  }

  .right{ text-align:right; }

  .kpi{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
  }
  @media (max-width:520px){ .kpi{ grid-template-columns:1fr; } }

  .kpi .box{
    background: rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    border-radius:16px;
    padding:12px;
  }
  .kpi .num{
    font-size:22px;
    font-weight:900;
  }
  .kpi .lbl{
    font-size:12px;
    color: rgba(255,255,255,.65);
    margin-top:4px;
  }

  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .link{
    color: rgba(255,255,255,.85);
    text-decoration: underline;
    cursor:pointer;
    font-weight:700;
  }

  .hidden{ display:none; }
</style>
