<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia do Concurseiro</title>

<style>
:root{
  --bg1:#0b1220;
  --bg2:#0f1b33;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.12);
  --text:#ffffff;
  --blue:#4f8cff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 10% 10%, rgba(79,140,255,.25), transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg2));
  padding:20px;
}

.wrap{max-width:720px;margin:0 auto;}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  backdrop-filter:blur(10px);
}

h1{text-align:center;margin:0 0 10px;}

#timer{
  font-size:48px;
  text-align:center;
  margin:15px 0;
  font-weight:bold;
}

.btnrow{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--stroke);
  background:rgba(0,0,0,.3);
  color:#fff;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>📚 Guia do Concurseiro</h1>
<div id="timer">00:00:00</div>

<div class="btnrow">
<button onclick="startTimer()">Iniciar</button>
<button onclick="pauseTimer()">Pausar</button>
<button onclick="resetTimer()">Zerar</button>
</div>

<input id="materia" placeholder="Matéria (ex: Português)">
<button style="margin-top:12px;width:100%;" onclick="salvarSessao()">Salvar sessão</button>
</div>

</div>

<script>
let segundos=0;
let intervalo=null;

function formatTime(total){
  const h=String(Math.floor(total/3600)).padStart(2,'0');
  const m=String(Math.floor((total%3600)/60)).padStart(2,'0');
  const s=String(total%60).padStart(2,'0');
  return h+":"+m+":"+s;
}

function tick(){
  segundos++;
  document.getElementById("timer").innerText=formatTime(segundos);
}

function startTimer(){
  if(!intervalo) intervalo=setInterval(tick,1000);
}

function pauseTimer(){
  clearInterval(intervalo);
  intervalo=null;
}

function resetTimer(){
  pauseTimer();
  segundos=0;
  document.getElementById("timer").innerText="00:00:00";
}

function salvarSessao(){
  const materia=document.getElementById("materia").value;
  if(!materia){alert("Coloque a matéria 🙂");return;}
  alert("Sessão salva de "+materia+" ✅");
  resetTimer();
  document.getElementById("materia").value="";
}
</script>

</body>
</html>
