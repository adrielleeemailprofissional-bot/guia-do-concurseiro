<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guia do Concurseiro</title>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --primary:#3b82f6;
  --success:#22c55e;
  --danger:#ef4444;
  --text:#f8fafc;
  --muted:#94a3b8;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

header{
  padding:20px;
  font-weight:900;
  font-size:20px;
  text-align:center;
}

.card{
  background:var(--card);
  margin:15px;
  padding:18px;
  border-radius:16px;
}

.timer{
  font-size:48px;
  text-align:center;
  font-weight:900;
  margin:10px 0;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:12px;
  font-weight:800;
  margin:5px;
  background:var(--primary);
  color:white;
}

button.danger{background:var(--danger);}
button.success{background:var(--success);}

input,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:none;
  background:#334155;
  color:white;
}

.tabs{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  background:#111827;
  padding:12px 0;
}

.tab{
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

.tab.active{
  color:var(--primary);
}

.hidden{display:none;}
</style>
</head>

<body>

<header>📚 Guia do Concurseiro</header>

<!-- TIMER -->
<div id="view-timer" class="card">
  <div class="timer" id="timer">00:00:00</div>
  <div style="text-align:center;">
    <button onclick="start()">Iniciar</button>
    <button onclick="pause()">Pausar</button>
    <button class="danger" onclick="reset()">Zerar</button>
  </div>

  <label>Matéria</label>
  <input id="materia">

  <label>Tipo</label>
  <select id="tipo">
    <option>Teoria</option>
    <option>Questões</option>
    <option>Revisão</option>
  </select>

  <button class="success" style="margin-top:12px;width:100%;" onclick="salvar()">Salvar sessão</button>
</div>

<!-- HISTORICO -->
<div id="view-historico" class="card hidden">
  <h3>Histórico</h3>
  <div id="lista"></div>
</div>

<!-- QUESTÕES -->
<div id="view-questoes" class="card hidden">
  <h3>Questões</h3>

  <label>Matéria</label>
  <input id="qMateria">

  <label>Acertos</label>
  <input type="number" id="qAcertos">

  <label>Erros</label>
  <input type="number" id="qErros">

  <button class="success" style="margin-top:12px;width:100%;" onclick="salvarQuestao()">Salvar</button>

  <div id="listaQuestoes" style="margin-top:15px;"></div>
</div>

<!-- DASHBOARD -->
<div id="view-dashboard" class="card hidden">
  <h3>Estatísticas</h3>
  <p id="totalTempo"></p>
  <p id="totalSessoes"></p>
  <p id="aproveitamento"></p>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="trocar('timer')">⏱️</div>
  <div class="tab" onclick="trocar('historico')">📜</div>
  <div class="tab" onclick="trocar('questoes')">🧠</div>
  <div class="tab" onclick="trocar('dashboard')">📊</div>
</div>

<script>
let segundos=0;
let intervalo=null;
let dados=JSON.parse(localStorage.getItem("dados")||'{"sessoes":[],"questoes":[]}');

function formatar(s){
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}

function start(){
  if(!intervalo){
    intervalo=setInterval(()=>{segundos++;document.getElementById("timer").innerText=formatar(segundos)},1000);
  }
}

function pause(){
  clearInterval(intervalo);
  intervalo=null;
}

function reset(){
  pause();
  segundos=0;
  document.getElementById("timer").innerText="00:00:00";
}

function salvar(){
  const materia=document.getElementById("materia").value;
  const tipo=document.getElementById("tipo").value;
  if(!materia||segundos===0){alert("Preencha matéria e cronometre");return;}

  dados.sessoes.unshift({materia,tipo,segundos,data:new Date().toLocaleString()});
  localStorage.setItem("dados",JSON.stringify(dados));
  reset();
  document.getElementById("materia").value="";
  render();
}

function salvarQuestao(){
  const materia=document.getElementById("qMateria").value;
  const acertos=Number(document.getElementById("qAcertos").value);
  const erros=Number(document.getElementById("qErros").value);
  if(!materia){alert("Informe matéria");return;}

  dados.questoes.unshift({materia,acertos,erros});
  localStorage.setItem("dados",JSON.stringify(dados));
  render();
}

function render(){
  let lista="";
  dados.sessoes.forEach(s=>{
    lista+=`<p><strong>${s.materia}</strong> - ${formatar(s.segundos)} (${s.tipo})</p>`;
  });
  document.getElementById("lista").innerHTML=lista;

  let listaQ="";
  dados.questoes.forEach(q=>{
    listaQ+=`<p>${q.materia} - ${q.acertos} acertos / ${q.erros} erros</p>`;
  });
  document.getElementById("listaQuestoes").innerHTML=listaQ;

  const totalSeg=dados.sessoes.reduce((a,b)=>a+b.segundos,0);
  document.getElementById("totalTempo").innerText="Tempo total: "+formatar(totalSeg);
  document.getElementById("totalSessoes").innerText="Sessões: "+dados.sessoes.length;

  const totA=dados.questoes.reduce((a,b)=>a+b.acertos,0);
  const totE=dados.questoes.reduce((a,b)=>a+b.erros,0);
  const perc=(totA+totE)?Math.round((totA/(totA+totE))*100):0;
  document.getElementById("aproveitamento").innerText="Aproveitamento: "+perc+"%";
}

function trocar(view){
  document.querySelectorAll(".card").forEach(c=>c.classList.add("hidden"));
  document.getElementById("view-"+view).classList.remove("hidden");

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");
}

render();
</script>

</body>
</html>
